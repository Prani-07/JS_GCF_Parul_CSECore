<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <script>
        var n=window.prompt("Enter number")
        for(var i=0;i<=10;i++){
            var a=n*i;
            document.write(n + "x" + i + "=" + a)
            document.write("<br>")
    }
            if(n%2==0){
                document.write("even")
            } else {
                document.write("odd")
            }
           
        
    </script>
</body>
</html>
